name: Docs CI

on:
  workflow_run:
    workflows: ["Build CI"]
    types: [completed]
    branches: ["main"]

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Doxygen
        run: sudo apt-get install doxygen graphviz -y

      - name: Configure CMake for only building documentation
        run: cmake -S . -B build -DBUILD_DOCS_ONLY=ON -DBUILD_ALL_DOCS=ON

      - name: Build documentation
        run: cmake --build build --target docs_all

      - name: Organize documentation for deployment
        run: |
          mkdir -p docs_deploy
          cp -r build/docs/html/* docs_deploy/

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-build
          path: docs_deploy

  publish:
    if: github.event.workflow_run.conclusion == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: docs-build
          path: docs_deploy

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: tests-*
          path: test_results

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Prepare Pages artifact
        run: |
          mkdir -p site/tests
          cp -r docs_deploy/. site/
          find test_results -type f -name 'tests-*.json' -exec cp {} site/tests/ \;

          cd site/tests

          # Build a JSON array of filenames
          FILES_JSON=$(ls -1 tests-*.json 2>/dev/null | jq -R . | jq -s . || echo "[]")

          cat > index.html << EOF
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Test results</title>
              <style>
                body { font-family: system-ui, sans-serif; margin: 2rem; }
                ul { list-style: disc; padding-left: 1.5rem; }
                a { text-decoration: none; }
                a:hover { text-decoration: underline; }
              </style>
            </head>
            <body>
              <h1>Test results</h1>
              <ul id="file-list"></ul>
              <script>
                const files = $FILES_JSON;
                const list = document.getElementById('file-list');
                if (files.length === 0) {
                  list.innerHTML = '<li>No test results yet.</li>';
                } else {
                  files.sort().forEach(file => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = file;
                    a.textContent = file;
                    li.appendChild(a);
                    list.appendChild(li);
                  });
                }
              </script>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
