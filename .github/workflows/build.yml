name: Build CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Configure CMake
        run: >
          cmake
          -B ${{ github.workspace }}/build
          -S ${{ github.workspace }}
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build ${{ github.workspace }}/build

      - name: Run tests on Linux and macOS
        working-directory: ${{ github.workspace }}/build/tests
        if: matrix.name != 'Windows'
        run: ./test_utility --gtest_output=json:tests-${{ matrix.name }}-${{ github.sha }}.json

      - name: Run tests on Windows
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $testsDir = "${{ github.workspace }}\build\tests"
          $testExecutable = Get-ChildItem -Path $testsDir -Filter test_utility.exe -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "test_utility.exe was not found"
          }

          $outputFile = "$testsDir\tests-Windows-${{ github.sha }}.json"

          & $testExecutable.FullName --gtest_output=json:"$outputFile"

          # Confirm file exists
          if (-not (Test-Path $outputFile)) {
            throw "Test output file was not created: $outputFile"
          }

      - name: Debug test output
        if: always()
        run: |
          echo "=== Listing test output directory ==="
          ls -R "${{ github.workspace }}/build/tests" || dir /s "${{ github.workspace }}\build\tests"

      - name: Debug test output directory
        if: always()
        shell: pwsh
        run: |
          $dir = "${{ github.workspace }}\build\tests"
          Write-Host "Listing: $dir"
          Get-ChildItem -Path $dir -Recurse -File |
            ForEach-Object { Write-Host $_.FullName }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.name }}
          path: ${{ github.workspace }}/build/tests/tests-${{ matrix.name }}-${{ github.sha }}.json
          if-no-files-found: error
