name: Build CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Configure CMake
        run: >
          cmake
          -B ${{ github.workspace }}/build
          -S ${{ github.workspace }}
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build ${{ github.workspace }}/build

      - name: Run tests on Linux and macOS
        working-directory: ${{ github.workspace }}/build/tests
        if: matrix.name != 'Windows'
        run: ./test_utility --gtest_output=json:tests-${{ matrix.name }}-${{ github.sha }}.json

      - name: Run tests on Windows
        working-directory: ${{ github.workspace }}/build/tests
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $testExecutable = Get-ChildItem -Path . -Filter test_utility.exe -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "test_utility.exe was not found"
          }
          & $testExecutable.FullName --gtest_output=json:tests-${{ matrix.name }}-${{ github.sha }}.json

      - name: Debug test output
        if: always()
        run: |
          echo "=== Listing test output directory ==="
          ls -R "${{ github.workspace }}/build/tests" || dir /s "${{ github.workspace }}\build\tests"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.name }}
          path: ${{ github.workspace }}/build/tests/tests-${{ matrix.name }}-${{ github.sha }}.json
          if-no-files-found: error

  publish-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare site directory
        run: |
          mkdir -p site/tests
          # Flatten artifacts into site/tests
          find artifacts -name 'tests-*.json' -exec cp {} site/tests/ \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0